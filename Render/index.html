<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Neon Fast Video & Audio Mixer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background-color: #080911;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(18, 20, 36, 0.95);
      border: 2px solid #00f0ff;
      box-shadow: 0 0 25px #00f0ff;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      color: #ff007f;
      text-shadow: 0 0 12px #ff007f;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #7000ff;
      border-radius: 8px;
      background: #101222;
      color: #00f0ff;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 15px;
    }
    input:focus { border-color: #ff007f; box-shadow: 0 0 15px #ff007f; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #ff007f, #7000ff);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px #ff007f;
      text-transform: uppercase;
    }
    #status {
      margin-top: 15px;
      font-size: 0.9rem;
      font-weight: bold;
      min-height: 20px;
    }
    #downloadLink {
      display: none;
      margin-top: 20px;
      padding: 12px;
      background: #39ff14;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 0 15px #39ff14;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>⚡ Fast Media Mixer</h1>
    <input type="text" id="videoUrl" placeholder="Paste YouTube link..." />
    <button id="processBtn">Process Video & Audio</button>
    <div id="status"></div>
    <a id="downloadLink" href="#" target="_blank">📥 Download Merged HD Video</a>
  </div>

  <script>
    document.getElementById('processBtn').addEventListener('click', async () => {
      const url = document.getElementById('videoUrl').value.trim();
      const status = document.getElementById('status');
      const downloadLink = document.getElementById('downloadLink');

      if (!url) {
        status.style.color = "#ff007f";
        status.innerText = "Please paste a link!";
        return;
      }

      status.style.color = "#00f0ff";
      status.innerText = "⚡ Fetching HD video & mixing audio...";
      downloadLink.style.display = "none";

      try {
        const response = await fetch('/api/process-video', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || "Processing failed");
        }

        status.style.color = "#39ff14";
        status.innerText = "✅ Video & Audio merged successfully!";
        
        downloadLink.href = data.downloadUrl;
        downloadLink.style.display = "inline-block";

      } catch (err) {
        status.style.color = "#ff007f";
        status.innerText = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
