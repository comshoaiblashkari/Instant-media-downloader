<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Media Downloader Control</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0e15;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      background: rgba(20, 22, 37, 0.85);
      border: 2px solid #00f0ff;
      box-shadow: 0 0 20px #00f0ff, inset 0 0 15px rgba(0, 240, 255, 0.3);
      border-radius: 16px;
      padding: 40px;
      width: 450px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2rem;
      color: #ff007f;
      text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #7000ff;
      border-radius: 8px;
      background: #16192b;
      color: #00f0ff;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 0 10px rgba(112, 0, 255, 0.5);
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #ff007f;
      box-shadow: 0 0 15px #ff007f;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(45deg, #ff007f, #7000ff);
      color: #fff;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 0 15px #ff007f;
      transition: transform 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px #ff007f, 0 0 10px #00f0ff;
    }

    #status {
      margin-top: 20px;
      font-size: 0.95rem;
      color: #39ff14;
      text-shadow: 0 0 8px #39ff14;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Media Downloader</h1>
    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="Paste YouTube Link Here..." />
    </div>
    <button id="downloadBtn">Send to Extension</button>
    <div id="status"></div>
  </div>

  <script>
    // Replace with your actual Extension ID from chrome://extensions
    const EXTENSION_ID = "YOUR_EXTENSION_ID_HERE";

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const url = document.getElementById('videoUrl').value;
      const statusDiv = document.getElementById('status');

      if (!url) {
        statusDiv.style.color = '#ff007f';
        statusDiv.innerText = 'Please enter a valid URL!';
        return;
      }

      statusDiv.style.color = '#00f0ff';
      statusDiv.innerText = 'Sending command to Chrome Extension...';

      if (typeof chrome !== "undefined" && chrome.runtime && chrome.runtime.sendMessage) {
        chrome.runtime.sendMessage(EXTENSION_ID, { action: "DOWNLOAD_VIDEO", url: url }, (response) => {
          if (chrome.runtime.lastError) {
            statusDiv.style.color = '#ff007f';
            statusDiv.innerText = 'Error connecting to Extension!';
            console.error(chrome.runtime.lastError);
          } else if (response && response.status === "success") {
            statusDiv.style.color = '#39ff14';
            statusDiv.innerText = 'Download initialized successfully!';
          }
        });
      } else {
        statusDiv.style.color = '#ff007f';
        statusDiv.innerText = 'Extension messaging API not available.';
      }
    });
  </script>
</body>
</html>
