<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Neon Ultra-Fast Media Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #080911;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: rgba(18, 20, 36, 0.95);
      border: 2px solid #00f0ff;
      box-shadow: 0 0 25px #00f0ff, inset 0 0 15px rgba(0, 240, 255, 0.2);
      border-radius: 16px;
      padding: 35px 25px;
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      color: #ff007f;
      text-shadow: 0 0 12px #ff007f, 0 0 20px #ff007f;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #7000ff;
      border-radius: 8px;
      background: #101222;
      color: #00f0ff;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 18px;
      box-shadow: 0 0 8px rgba(112, 0, 255, 0.4);
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #ff007f;
      box-shadow: 0 0 15px #ff007f;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #ff007f, #7000ff);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 15px #ff007f;
      transition: transform 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px #ff007f, 0 0 10px #00f0ff;
    }

    #status {
      margin-top: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      min-height: 24px;
      word-break: break-word;
    }

    .dl-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #39ff14;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 0 15px #39ff14;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚡ Neon Media Downloader</h1>
    <input type="text" id="videoUrl" placeholder="Paste YouTube Link Here..." />
    <button id="downloadBtn">Get Download Link</button>
    <div id="status"></div>
    <div id="result"></div>
  </div>

  <script>
    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const url = document.getElementById('videoUrl').value.trim();
      const status = document.getElementById('status');
      const result = document.getElementById('result');

      status.innerText = "";
      result.innerHTML = "";

      if (!url) {
        status.style.color = "#ff007f";
        status.innerText = "Please paste a YouTube URL!";
        return;
      }

      status.style.color = "#00f0ff";
      status.innerText = "⚡ Extracting HD Video & Audio...";

      try {
        // High-speed API that handles video/audio mixing and bypasses Render IP blocks
        const response = await fetch("https://cobalt-api.kwippy.com/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            url: url,
            vQuality: "1080"
          })
        });

        const data = await response.json();

        if (data.url) {
          status.style.color = "#39ff14";
          status.innerText = "✅ Video Processed Successfully!";
          
          // Triggers immediate browser download
          window.location.href = data.url;

          result.innerHTML = `<a class="dl-btn" href="${data.url}" target="_blank">📥 Click Here If Download Didn't Start</a>`;
        } else {
          throw new Error("Could not extract stream. Please check link.");
        }

      } catch (err) {
        status.style.color = "#ff007f";
        status.innerText = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
