<script>
  const RENDER_BACKEND_URL = "https://instant-youtube-downloader.onrender.com";

  document.getElementById('downloadBtn').addEventListener('click', async () => {
    const url = document.getElementById('videoUrl').value.trim();
    const status = document.getElementById('status');

    if (!url) {
      status.style.color = "#ff007f";
      status.innerText = "Please enter a YouTube link!";
      return;
    }

    status.style.color = "#00f0ff";
    status.innerText = "⚡ Extracting video link...";

    try {
      const response = await fetch(`${RENDER_BACKEND_URL}/api/get-download-link`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      const data = await response.json();

      if (!response.ok || data.error) {
        throw new Error(data.error || "Failed to parse YouTube link.");
      }

      status.style.color = "#39ff14";
      status.innerText = "✅ Download starting!";

      // Open YouTube direct video stream URL in a new tab to trigger browser download
      window.open(data.directUrl, '_blank');

    } catch (err) {
      status.style.color = "#ff007f";
      status.innerText = "Error: " + err.message;
    }
  });
</script>
